[project]
name = "worldcrafter-data-runtime"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
dependencies = [
  "depth-anything-3 @ git+https://github.com/ByteDance-Seed/Depth-Anything-3.git@3d835ec1a5802d64a8b8b15f817a1ab54809bfe4",
  "addict==2.4.0", "timm==1.0.25",
  "torch==2.10.0+cu128", "torchvision==0.25.0+cu128", "xformers==0.0.35",
]
[tool.uv]
index-strategy = "unsafe-best-match"
[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"

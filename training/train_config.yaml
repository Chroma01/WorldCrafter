# Fine-tune Base: existing rank-128 low-rank adapters and camera-conditioning adapters.
model_path: weights/WorldCrafter-Base
feature_root: data/WorldCrafter/features
valid_chunks: data/WorldCrafter/valid_chunk_indices.json
pool: null
output_dir: outputs/finetune-base
seed: 43
# Use intrinsics normalized by the camera estimator's processed image dimensions.
intrinsics_contract: native
learning_rate: 3.0e-5
# Reference: 32 processes x accumulation 1; use accumulation 4 with eight GPUs.
gradient_accumulation_steps: 1
max_steps: 1000000
checkpoint_every: 500
checkpoint_at_step_zero: true
